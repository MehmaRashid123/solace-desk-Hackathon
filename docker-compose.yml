services:
  db:
    image: postgres:16-alpine
    container_name: lumen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    ports:
      - "5433:5432"
    volumes:
      - lumen_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lumen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: lumen-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lumen:lumen@db:5432/lumen?schema=public
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:3000
      PORT: 4000
      JWT_ACCESS_SECRET: lumen-access-secret-change-in-prod-32!!
      JWT_REFRESH_SECRET: lumen-refresh-secret-change-in-prod-32!
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      AI_TIMEOUT_MS: 8000
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy


  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    container_name: lumen-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  lumen_pg:
